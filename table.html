<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ラーメン屋のメニュー</title>
    <style>
        table {
            border-collapse: collapse; /* 枠線を1本にまとめる */
            width: 300px;              /* 表の横幅 */
        }
        th, td {
            border: 1px solid #000000; /* 黒色の枠線をつける */
            padding: 8px;              /* マスの中の隙間 */
            text-align: left;          /* 文字を左寄せにする */
        }
        th {
            background-color: #f2f2f2; /* 見出しの背景を薄いグレーにする */
        }
    </style>
</head>   
<body>

    <h2>メニュー表</h2>

    <table>
        
        <tr>
            <th>メニュー名</th>
            <th>価格</th>
        </tr>
        
        <tr>
            <td>醤油ラーメン</td>
            <td>750円</td>
        </tr>
        
        <tr>
            <td>塩ラーメン</td>
            <td>700円</td>
        </tr>
        
        <tr>
            <td>豚骨ラーメン</td>
            <td>800円</td>
        </tr>
        
        <tr>
            <td>ライス</td>
            <td>150円</td>
        </tr>
        
    </table>
    </body>
</html>
